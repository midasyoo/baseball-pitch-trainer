<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="투구 트레이너">
<title>야구 투구 트레이너 — Baseball Pitch Trainer</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171e2e; --panel2:#1e2740; --line:#2a3550;
    --text:#e8edf7; --dim:#8b97b5; --accent:#ffb300; --accent2:#4fc3f7;
    --good:#66bb6a; --warn:#ffa726; --fast:#ef5350; --brk:#ab47bc; --off:#26a69a; --spc:#78909c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    overflow:hidden;
  }
  #app{display:flex; flex-direction:column; height:100vh;}

  /* ── 헤더 ─────────────────────────── */
  header{
    height:54px; flex:0 0 54px; display:flex; align-items:center; gap:16px;
    padding:0 16px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  header .logo{font-size:18px; font-weight:800; letter-spacing:.5px;}
  header .logo em{color:var(--accent); font-style:normal;}
  .top-tabs{display:flex; gap:6px; margin-left:12px;}
  .top-tab{
    padding:8px 18px; border-radius:20px; border:1px solid var(--line);
    background:transparent; color:var(--dim); font-size:14px; font-weight:700; cursor:pointer;
  }
  .top-tab.active{background:var(--accent); border-color:var(--accent); color:#20242e;}
  header .note{margin-left:auto; font-size:11px; color:var(--dim);}
  header .credit{text-align:right; font-size:12px; line-height:1.35; font-weight:600; color:var(--text); white-space:nowrap;}

  /* ── 본문 3단 ─────────────────────── */
  #main{flex:1; display:grid; grid-template-columns:225px 1fr 350px; min-height:0;}

  /* 사이드바 */
  #sidebar{background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:12px 10px;}
  .fam-title{font-size:11px; font-weight:800; letter-spacing:1px; color:var(--dim); margin:14px 4px 6px;}
  .fam-title:first-child{margin-top:2px;}
  .fam-title.FASTBALL{color:var(--fast);} .fam-title.BREAKING{color:var(--brk);}
  .fam-title.OFFSPEED{color:var(--off);} .fam-title.SPECIAL{color:var(--spc);}
  .pitch-btn{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    padding:9px 12px; margin:4px 0; border-radius:10px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:13px; font-weight:600;
    cursor:pointer; text-align:left;
  }
  .pitch-btn:hover{border-color:var(--accent2);}
  .pitch-btn.active{border-color:var(--accent); background:#2b3552; box-shadow:0 0 0 1px var(--accent) inset;}
  .pitch-btn .en{font-size:10px; color:var(--dim); font-weight:400; display:block;}
  .pitch-btn.locked{opacity:.45; cursor:not-allowed;}
  .pitch-btn.locked:hover{border-color:var(--line);}
  .lock{font-size:11px;}

  /* 중앙: 3D + 하단바 */
  #center{display:flex; flex-direction:column; min-width:0; min-height:0;}
  #viewport{flex:1; position:relative; min-height:0; background:#0a0e18;}
  #viewport canvas{display:block;}
  #phase-label{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    padding:6px 20px; border-radius:18px; background:rgba(15,20,32,.82);
    border:1px solid var(--line); font-size:15px; font-weight:800; letter-spacing:1.5px;
    color:var(--accent); pointer-events:none; white-space:nowrap;
  }
  #pitch-badge{
    position:absolute; top:14px; left:14px; padding:6px 12px; border-radius:10px;
    background:rgba(15,20,32,.82); border:1px solid var(--line); pointer-events:none;
  }
  #pitch-badge .ko{font-size:15px; font-weight:800;}
  #pitch-badge .en{font-size:10px; color:var(--dim);}
  #pitch-badge .hand{font-size:10px; color:var(--accent2); margin-top:3px; font-weight:700;}
  #spin-hud{
    position:absolute; bottom:14px; left:14px; padding:8px 12px; border-radius:10px;
    background:rgba(15,20,32,.86); border:1px solid var(--line); font-size:12px;
    color:var(--accent2); display:none; max-width:260px; line-height:1.5;
  }
  .hud-row{cursor:pointer; padding:2px 6px; border-radius:6px; margin-top:2px; color:#c9d3e8;}
  .hud-row:hover{background:#2b3552;}
  .hud-row.sel{background:#2b3552; outline:1px solid var(--accent2);}
  #drag-hint{
    position:absolute; bottom:14px; right:14px; font-size:11px; color:var(--dim);
    background:rgba(15,20,32,.7); padding:4px 10px; border-radius:8px; pointer-events:none;
  }

  #bottombar{
    flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line);
    padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center;
  }
  .bar-group{display:flex; gap:5px; align-items:center;}
  .bar-label{font-size:10px; color:var(--dim); font-weight:700; letter-spacing:1px; margin-right:2px;}
  .sub-btn,.ctl-btn,.view-btn,.spd-btn{
    padding:7px 13px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:12px; font-weight:700; cursor:pointer;
  }
  .sub-btn:hover,.ctl-btn:hover,.view-btn:hover,.spd-btn:hover{border-color:var(--accent2);}
  .sub-btn.active{background:var(--accent); color:#20242e; border-color:var(--accent);}
  .view-btn.active,.spd-btn.active{background:var(--accent2); color:#0f1420; border-color:var(--accent2);}
  button:disabled{opacity:.35; cursor:not-allowed !important;}
  button:disabled:hover{border-color:var(--line) !important;}

  /* 우측 정보 패널 */
  #infopanel{background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:16px;}
  #infopanel h2{font-size:16px; margin-bottom:4px;}
  #infopanel h3{font-size:13px; color:var(--accent); margin:16px 0 6px;}
  #infopanel p,#infopanel li{font-size:13px; line-height:1.65; color:#c9d3e8;}
  #infopanel ul{padding-left:18px;}
  .tag{display:inline-block; font-size:10px; font-weight:800; padding:2px 8px; border-radius:8px; margin-right:4px;}
  .tag.FASTBALL{background:var(--fast); color:#fff;} .tag.BREAKING{background:var(--brk); color:#fff;}
  .tag.OFFSPEED{background:var(--off); color:#fff;} .tag.SPECIAL{background:var(--spc); color:#fff;}
  .diff{color:var(--accent); font-size:12px;}
  .box{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0;}
  .safety{border-left:3px solid var(--warn); background:#2b2416;}
  .safety p{color:#ffd88a; font-size:12px;}

  /* 자가진단 */
  .q-item{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0;}
  .q-item .q{font-size:13px; margin-bottom:8px;}
  .yn{display:flex; gap:6px;}
  .yn button{flex:1; padding:6px 0; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--dim); font-weight:700; cursor:pointer; font-size:12px;}
  .yn button.sel-yes{background:var(--good); border-color:var(--good); color:#fff;}
  .yn button.sel-no{background:var(--fast); border-color:var(--fast); color:#fff;}
  #score-btn{width:100%; margin-top:10px; padding:11px 0; border-radius:10px; border:none; background:var(--accent); color:#20242e; font-size:14px; font-weight:800; cursor:pointer;}
  .grip-photo-btn{flex:1; padding:10px 0; border-radius:10px; border:1px solid var(--accent2); background:var(--panel2); color:var(--accent2); font-size:12.5px; font-weight:800; cursor:pointer;}
  .grip-photo-btn:hover{background:#223052;}
  #score-result{margin-top:12px;}
  .score-big{font-size:34px; font-weight:900; color:var(--accent); text-align:center;}
  .score-line{font-size:12.5px; line-height:1.7; color:#c9d3e8;}
  .score-line.ok::before{content:"✓ "; color:var(--good); font-weight:900;}
  .score-line.fix::before{content:"△ "; color:var(--warn); font-weight:900;}
  .disclaimer{font-size:10.5px; color:var(--dim); margin-top:10px; text-align:center;}

  /* ── 스마트폰(세로) 레이아웃: 구종 칩 가로 스크롤 → 3D → 컨트롤 → 정보 패널 세로 스택 ── */
  @media (max-width: 820px){
    body{overflow-y:auto; overflow-x:hidden;}
    #app{height:auto; min-height:100dvh;}
    header{height:auto; flex:0 0 auto; flex-wrap:wrap; padding:8px 10px; gap:8px;
      position:sticky; top:0; z-index:20;}
    header .logo{font-size:15px;}
    .top-tab{padding:6px 13px; font-size:12.5px;}
    header .note{display:none;}
    header .credit{margin-left:auto; font-size:10px;}
    #main{display:block; min-height:0;}
    /* 구종 목록 → 가로 스크롤 칩 바 */
    #sidebar{display:flex; flex-direction:row; align-items:center; gap:6px;
      overflow-x:auto; overflow-y:hidden; padding:8px;
      border-right:none; border-bottom:1px solid var(--line);
      -webkit-overflow-scrolling:touch;}
    .fam-title, .fam-title:first-child{flex:0 0 auto; margin:0 2px; font-size:10px; white-space:nowrap;}
    .pitch-btn{flex:0 0 auto; width:auto; margin:0; padding:8px 11px; font-size:12px; white-space:nowrap;}
    .pitch-btn .en{display:none;}
    .pitch-btn span:last-child{margin-left:6px; font-size:10px;}
    /* 3D 화면 */
    #center{display:block;}
    #viewport{height:47vh; min-height:300px;}
    #pitch-badge{top:8px; left:8px; padding:4px 8px;}
    #pitch-badge .ko{font-size:12.5px;}
    #pitch-badge .en{display:none;}
    #phase-label{top:8px; font-size:11px; padding:4px 12px; letter-spacing:0.5px; max-width:88%;
      overflow:hidden; text-overflow:ellipsis;}
    #spin-hud{max-width:190px; font-size:10.5px; bottom:8px; left:8px; padding:6px 9px;}
    #drag-hint{display:none;}
    /* 하단 컨트롤 */
    #bottombar{padding:7px 8px; gap:6px 10px;}
    .bar-label{font-size:9px;}
    .sub-btn,.ctl-btn,.view-btn,.spd-btn{padding:7px 9px; font-size:11px;}
    /* 정보/연습 패널: 3D 아래로 */
    #infopanel{border-left:none; border-top:1px solid var(--line); padding:14px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">⚾ BASEBALL <em>PITCH TRAINER</em></div>
    <div class="top-tabs">
      <button class="top-tab active" id="tab-learn">🧠 원리 이해</button>
      <button class="top-tab" id="tab-practice">✋ 실제 연습</button>
    </div>
    <div class="note">청소년 학습용 시뮬레이터 · 전문 평가가 아닌 학습 참고용입니다</div>
    <div class="credit">기획/제작: 유윤식<br>midasyoo@etri.re.kr</div>
  </header>

  <div id="main">
    <nav id="sidebar"></nav>

    <div id="center">
      <div id="viewport">
        <div id="pitch-badge"><div class="ko"></div><div class="en"></div><div class="hand">🖐 오른손 투수(우투) 기준</div></div>
        <div id="phase-label"></div>
        <div id="spin-hud"></div>
        <div id="drag-hint">🖱️ 드래그: 회전 · 휠: 확대/축소</div>
      </div>
      <div id="bottombar">
        <div class="bar-group" id="submode-group">
          <span class="bar-label">단계</span>
          <button class="sub-btn active" data-sub="GRIP">① 그립</button>
          <button class="sub-btn" data-sub="RELEASE">② 릴리스</button>
          <button class="sub-btn" data-sub="SPIN">③ 회전</button>
          <button class="sub-btn" data-sub="MOTION">④ 투구 자세</button>
          <button class="sub-btn" data-sub="PATH">⑤ 궤적</button>
        </div>
        <div class="bar-group">
          <span class="bar-label">재생</span>
          <button class="ctl-btn" id="btn-play">▶ 재생</button>
          <button class="ctl-btn" id="btn-replay">⟲ 처음부터</button>
        </div>
        <div class="bar-group">
          <span class="bar-label">속도</span>
          <button class="spd-btn" data-speed="0.25">0.25x</button>
          <button class="spd-btn" data-speed="0.5">0.5x</button>
          <button class="spd-btn active" data-speed="1">1x</button>
        </div>
        <div class="bar-group">
          <span class="bar-label">시점</span>
          <button class="view-btn active" data-view="GRIP">그립</button>
          <button class="view-btn" data-view="PITCHER">투수</button>
          <button class="view-btn" data-view="CATCHER">포수</button>
          <button class="view-btn" data-view="BATTER">타자</button>
        </div>
      </div>
    </div>

    <aside id="infopanel">
      <div id="learn-panel"></div>
      <div id="practice-panel" style="display:none"></div>
    </aside>
  </div>
</div>

/* ═══════════════ 야구공 (실밥 = 실제 3D 곡선) ═══════════════ */
function seamCurvePoints(R, n=600){
  // 야구공 실밥의 표준 파라메트릭 곡선 (t: 0→4π 닫힌 곡선)
  const a = 0.44, pts = [];
  for(let i=0; i<=n; i++){
    const t = i/n * Math.PI*4;
    const theta = Math.PI/2 - (Math.PI/2 - a)*Math.cos(t);
    const phi = t/2 + a*Math.sin(2*t);
    pts.push(new THREE.Vector3(
      R*Math.sin(theta)*Math.cos(phi),
      R*Math.cos(theta),
      R*Math.sin(theta)*Math.sin(phi)
    ));
  }
  return pts;
}
function createBaseball(R){
  const g = new THREE.Group();
  const leather = new THREE.Mesh(
    new THREE.SphereGeometry(R, 48, 48),
    new THREE.MeshStandardMaterial({color:0xf4efe4, roughness:0.55})
  );
  g.add(leather);
  const curve = new THREE.CatmullRomCurve3(seamCurvePoints(R*0.995), true);
  const seam = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 500, R*0.035, 8, true),
    new THREE.MeshStandardMaterial({color:0xc62828, roughness:0.7})
  );
  g.add(seam);
  return g;
}

function makeLabel(text, color='#ffffff', size=44){
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  ctx.font = `800 ${size}px Pretendard, "Malgun Gothic", sans-serif`;
  const w = Math.ceil(ctx.measureText(text).width) + 36;
  cv.width = w; cv.height = size + 28;
  const c2 = cv.getContext('2d');
  c2.fillStyle = 'rgba(10,14,24,0.75)';
  c2.beginPath(); c2.roundRect(0,0,cv.width,cv.height,14); c2.fill();
  c2.font = `800 ${size}px Pretendard, "Malgun Gothic", sans-serif`;
  c2.fillStyle = color; c2.textBaseline='middle'; c2.textAlign='center';
  c2.fillText(text, cv.width/2, cv.height/2+2);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthTest:false}));
  const s = 0.0042;
  sp.scale.set(cv.width*s, cv.height*s, 1);
  return sp;
}

/* ── 리얼 스킨 텍스처: 관절 주름 · 손등 잔주름 · 손금 · 피부 결 ──
   u(둘레): 0.25 = 손등쪽(약간 어둡게), 0.75 = 공에 닿는 안쪽(밝게, 주름/손금)
   v(길이): 0 = 뿌리 → 1 = 손끝 */
function makeSkinTexture(creases, palmLines){
  const W = 256, H = 512;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0.00,'#e4ae86'); g.addColorStop(0.25,'#dca67d');
  g.addColorStop(0.50,'#e4ae86'); g.addColorStop(0.75,'#f1c8a8');
  g.addColorStop(1.00,'#e4ae86');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 손끝 쪽 혈색
  const g2 = ctx.createLinearGradient(0, H, 0, 0);
  g2.addColorStop(0,'rgba(255,190,170,0)'); g2.addColorStop(1,'rgba(255,190,170,0.28)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
  // 관절 주름(안쪽 3겹) + 손등 잔주름
  for(const sj of creases){
    const y = (1 - sj) * H;
    for(const [dy, lw, al] of [[0,3.4,0.42],[-7,1.6,0.20],[7,1.6,0.20]]){
      ctx.strokeStyle = `rgba(138,80,50,${al})`; ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(W*0.53, y+dy);
      ctx.quadraticCurveTo(W*0.75, y+dy+4, W*0.97, y+dy);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(150,95,60,0.16)'; ctx.lineWidth = 1.4;
    for(let k = 0; k < 4; k++){
      const y2 = y - 9 + k*6;
      ctx.beginPath();
      ctx.moveTo(W*0.09, y2);
      ctx.quadraticCurveTo(W*0.25, y2+3, W*0.41, y2);
      ctx.stroke();
    }
  }
  // 손금 (손바닥 전용)
  if(palmLines){
    ctx.strokeStyle = 'rgba(150,90,55,0.35)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(W*0.58,H*0.82); ctx.quadraticCurveTo(W*0.78,H*0.55, W*0.94,H*0.42); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W*0.55,H*0.60); ctx.quadraticCurveTo(W*0.76,H*0.40, W*0.90,H*0.18); ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W*0.62,H*0.90); ctx.quadraticCurveTo(W*0.72,H*0.72, W*0.86,H*0.68); ctx.stroke();
  }
  // 피부 결 노이즈
  for(let i = 0; i < 700; i++){
    ctx.fillStyle = Math.random() < 0.5 ? 'rgba(120,70,45,0.05)' : 'rgba(255,230,210,0.05)';
    ctx.fillRect(Math.random()*W, Math.random()*H, 1.6, 1.2);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}
const TEX_FINGER = makeSkinTexture([0.33,0.67], false);
const TEX_THUMB  = makeSkinTexture([0.5], false);
const TEX_PALM   = makeSkinTexture([], true);
const SKIN        = new THREE.MeshStandardMaterial({color:0xe4ae86, roughness:0.65});
const SKIN_FINGER = new THREE.MeshStandardMaterial({map:TEX_FINGER, bumpMap:TEX_FINGER, bumpScale:0.012, roughness:0.62, side:THREE.DoubleSide});
const SKIN_THUMB  = new THREE.MeshStandardMaterial({map:TEX_THUMB,  bumpMap:TEX_THUMB,  bumpScale:0.012, roughness:0.62, side:THREE.DoubleSide});
const SKIN_PALM   = new THREE.MeshStandardMaterial({map:TEX_PALM,   bumpMap:TEX_PALM,   bumpScale:0.010, roughness:0.66, side:THREE.DoubleSide});
const NAIL        = new THREE.MeshStandardMaterial({color:0xf3d9c1, roughness:0.28});

/* 단위벡터 구면 보간 — 손가락이 공 표면을 따라 감싸는 측지선 경로 */
function slerpVec(a, b, s, out){
  const d = THREE.MathUtils.clamp(a.dot(b), -1, 1);
  const om = Math.acos(d);
  if(om < 1e-4) return out.copy(a);
  const so = Math.sin(om);
  const fa = Math.sin((1-s)*om)/so, fb = Math.sin(s*om)/so;
  return out.set(a.x*fa + b.x*fb, a.y*fa + b.y*fb, a.z*fa + b.z*fb);
}

/* 링 목록 → 매끈한 살 튜브 (타원 단면 + 공에 닿는 면 눌림) */
function ringsToGeometry(rings, radial, flatten){
  const pos = [], norm = [], uv = [], idx = [];
  const p = new THREE.Vector3(), n = new THREE.Vector3();
  for(const ring of rings){
    for(let j = 0; j <= radial; j++){
      const a = j/radial * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      const squash = sa < 0 ? (1 - flatten*(-sa)) : 1;    // 공에 닿는 면은 살이 눌려 납작
      p.copy(ring.P)
        .addScaledVector(ring.S, ca*ring.w)
        .addScaledVector(ring.O, sa*ring.h*squash);
      n.copy(ring.S).multiplyScalar(ca).addScaledVector(ring.O, sa).normalize();
      pos.push(p.x, p.y, p.z); norm.push(n.x, n.y, n.z);
      uv.push(j/radial, ring.v);
    }
  }
  for(let i = 0; i < rings.length-1; i++){
    for(let j = 0; j < radial; j++){
      const a = i*(radial+1)+j, b = a + radial + 1;
      idx.push(a, b, a+1, b, b+1, a+1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(norm, 3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}
/* 튜브 양 끝을 둥글게 닫는 반구 링 */
function capRings(ring, T, sign, n=5){
  const out = [];
  for(let k = 1; k <= n; k++){
    const a = k/n * Math.PI/2;
    out.push({
      P: ring.P.clone().addScaledVector(T, sign*Math.sin(a)*ring.h*0.95),
      S: ring.S, O: ring.O,
      w: Math.max(ring.w*Math.cos(a), 0.001),
      h: Math.max(ring.h*Math.cos(a), 0.001),
      v: ring.v
    });
  }
  return out;
}

/* 실제 손가락 하나: 곧은 마디가 관절에서 꺾이며 공을 감싸는 구조.
   관절(PIP/DIP)은 공에서 살짝 떠서 볼록 튀어나오고, 손끝 지문 패드만 공에 닿는다. */
function buildRealFinger(name, K, C){
  const r = FINGER_R[name];
  const isThumb = (name === 'thumb');
  const uK = K.clone().normalize(), uC = C.clone().normalize();
  const hugR = 1 + r*0.72;                        // 살이 공 표면에 닿는 중심선 반경
  const jointsS = isThumb ? [0.5] : [0.33, 0.67]; // 곡선 파라미터상 관절 위치
  const segsL = 46, radial = 20;
  // 관절 매듭점: 뿌리(MCP) → PIP → DIP → 손끝. 관절은 공에서 띄우고 손끝 패드는 눌러 붙인다.
  const jf = isThumb ? [0.52] : [0.40, 0.72];     // 측지선상 관절 비율
  const tmp = new THREE.Vector3();
  const knots = [K.clone()];
  for(const f of jf){
    slerpVec(uK, uC, f, tmp);
    knots.push(tmp.clone().multiplyScalar(hugR*1.075));   // 관절이 볼록 솟음 → 마디는 직선
  }
  knots.push(uC.clone().multiplyScalar(hugR*0.98));       // 손끝 패드는 공에 눌림
  const centerline = new THREE.CatmullRomCurve3(knots, false, 'centripetal');
  const pts = centerline.getPoints(segsL);
  const rings = [], frames = [];
  for(let i = 0; i <= segsL; i++){
    const s = i/segsL;
    const T = new THREE.Vector3().subVectors(pts[Math.min(i+1,segsL)], pts[Math.max(i-1,0)]).normalize();
    const S = new THREE.Vector3().crossVectors(T, pts[i].clone().normalize()).normalize();
    const O = new THREE.Vector3().crossVectors(S, T).normalize();
    let prof = 1 - 0.12*s;                                        // 뿌리→손끝 테이퍼
    for(const js of jointsS){
      prof += 0.055*Math.exp(-Math.pow((s-js)/0.055, 2));         // 관절 도톰
      prof -= 0.050*Math.exp(-Math.pow((s-js)/0.016, 2));         // 관절 주름 파임
    }
    if(s > 0.86) prof *= 1 - 0.26*Math.pow((s-0.86)/0.14, 1.8);   // 손끝 (둥글게)
    rings.push({P:pts[i], S, O, w:r*prof, h:r*0.84*prof, v:s});
    frames.push({T, S, O});
  }
  const all = [...capRings(rings[0], frames[0].T, -1).reverse(), ...rings, ...capRings(rings[segsL], frames[segsL].T, 1)];
  const fGroup = new THREE.Group();
  fGroup.add(new THREE.Mesh(ringsToGeometry(all, radial, 0.30), isThumb ? SKIN_THUMB : SKIN_FINGER));
  // 손톱: 손끝 등쪽에 묻힌 타원판
  const iN = Math.round(0.93*segsL);
  const fr = frames[iN], rg = rings[iN];
  const nail = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 12), NAIL);
  nail.scale.set(r*0.50, r*0.15, r*0.62);
  nail.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(fr.S, fr.O, fr.T));
  nail.position.copy(rg.P).addScaledVector(fr.O, rg.h*0.72);
  fGroup.add(nail);
  return fGroup;
}
/* 오른손(우투수) 기준 손가락 시작점.
   투수 시점(-Z에서 +Z를 바라봄)에서 엄지가 왼쪽(-X), 검지→새끼가 왼쪽→오른쪽.
   그립 데이터·투구 자세(오른팔 투구)·궤적 설명 모두 우투수 기준으로 통일. */
/* 실제 인체 비율: 공 반지름 1(=3.7cm) 기준 손가락 지름 ≈ 0.45, 손바닥 폭 ≈ 2.2 (공보다 큼) */
const KNUCKLES = {
  index:  new THREE.Vector3( 0.62,-0.10,-1.12),
  middle: new THREE.Vector3( 0.21,-0.02,-1.16),
  ring:   new THREE.Vector3(-0.21,-0.06,-1.15),
  pinky:  new THREE.Vector3(-0.62,-0.20,-1.10),
  thumb:  new THREE.Vector3( 0.95,-0.55,-0.75)
};
const FINGER_R = { index:0.21, middle:0.22, ring:0.20, pinky:0.17, thumb:0.26 };
const MARKER_COLORS = { index:'#ff5252', middle:'#40c4ff', ring:'#b2ff59', pinky:'#ce93d8', thumb:'#ffd740' };
const FINGER_KO = { index:'검지', middle:'중지', ring:'약지', pinky:'새끼', thumb:'엄지' };

let handGroup = null;        // 손 전체 (리그 또는 절차적)
let fingerMeshes = {};       // 절차적 손: name -> {group, baseDir}
let markerGroup = null;      // 접촉점 마커+라벨

/* 절차적 손 (GLB 로드 실패 시 폴백) */
function buildProceduralHand(pitch){
  if(handGroup){ ballWorld.remove(handGroup); }
  handGroup = new THREE.Group();
  fingerMeshes = {};

  // 오른 손바닥: 손목→너클로 넓어지는 실제 손 곡면 (손금 텍스처 포함)
  {
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3( 0.08,-1.30,-1.80),
      new THREE.Vector3( 0.04,-0.74,-1.55),
      new THREE.Vector3( 0.00,-0.24,-1.24)
    );
    const segsL = 24, radial = 22;
    const rings = [], frames = [];
    for(let i = 0; i <= segsL; i++){
      const s = i/segsL;
      const P = curve.getPoint(s);
      const T = curve.getTangent(s).normalize();
      const S = new THREE.Vector3().crossVectors(T, P.clone().normalize()).normalize();
      const O = new THREE.Vector3().crossVectors(S, T).normalize();
      const e = smoothstep01(s, 0, 1);
      rings.push({P, S, O,
        w: THREE.MathUtils.lerp(0.34, 1.02, e),   // 손목 → 너클로 넓어짐 (실제 손바닥 폭)
        h: THREE.MathUtils.lerp(0.24, 0.19, s),
        v: s});
      frames.push({T, S, O});
    }
    const all = [...capRings(rings[0], frames[0].T, -1).reverse(), ...rings, ...capRings(rings[segsL], frames[segsL].T, 1)];
    handGroup.add(new THREE.Mesh(ringsToGeometry(all, radial, 0.25), SKIN_PALM));
    // 엄지 두덩(무지구) / 새끼 두덩(소지구)
    const thenar = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 18), SKIN);
    thenar.scale.set(0.42, 0.28, 0.48);
    thenar.position.set(0.76,-0.70,-1.08);
    thenar.rotation.x = 0.5;
    handGroup.add(thenar);
    const hypo = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 18), SKIN);
    hypo.scale.set(0.30, 0.20, 0.42);
    hypo.position.set(-0.48,-0.68,-1.38);
    hypo.rotation.x = 0.55;
    handGroup.add(hypo);
    // 팔목
    const wristDir = curve.getTangent(0).normalize();
    const wrist = new THREE.Mesh(new THREE.CapsuleGeometry(0.29, 0.6, 6, 14), SKIN);
    wrist.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), wristDir);
    wrist.position.copy(curve.getPoint(0)).addScaledVector(wristDir, -0.30);
    handGroup.add(wrist);
    // 손가락 사이 물갈퀴 살
    for(const [a,b] of [['index','middle'],['middle','ring'],['ring','pinky']]){
      const web = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 12), SKIN);
      web.scale.set(0.22, 0.12, 0.18);
      web.position.copy(KNUCKLES[a]).add(KNUCKLES[b]).multiplyScalar(0.5)
        .add(new THREE.Vector3(0, 0.07, 0.03));
      handGroup.add(web);
    }
  }

  for(const [name, def] of Object.entries(pitch.grip.fingers)){
    const C = new THREE.Vector3(...def.pos).normalize();          // 접촉점 (반지름 1)
    const K = KNUCKLES[name].clone();
    const dir = C.clone();                                        // 공 중심→접촉점 방향
    const fGroup = buildRealFinger(name, K, C);
    handGroup.add(fGroup);
    fingerMeshes[name] = { group:fGroup, baseDir:dir };
  }
  ballWorld.add(handGroup);
}

/* 접촉점 마커 + 라벨 (손 방식과 무관하게 공용) */
function buildMarkers(pitch){
  if(markerGroup){ ballWorld.remove(markerGroup); }
  markerGroup = new THREE.Group();
  for(const [name, def] of Object.entries(pitch.grip.fingers)){
    if(!def.main) continue;
    const C = new THREE.Vector3(...def.pos).normalize();
    const mk = new THREE.Mesh(
      new THREE.SphereGeometry(0.075, 14, 14),
      new THREE.MeshBasicMaterial({color:MARKER_COLORS[name]})
    );
    mk.position.copy(C.clone().multiplyScalar(1.30));
    markerGroup.add(mk);
    const lb = makeLabel(FINGER_KO[name]+' 접촉', MARKER_COLORS[name]);
    lb.position.copy(C.clone().multiplyScalar(1.56));
    markerGroup.add(lb);
  }
  ballWorld.add(markerGroup);
}

/* ═══════════════ 리깅된 리얼 핸드 (WebXR generic-hand, Apache-2.0) ═══════════════
   스킨드 메시 + 25개 관절 뼈대. 구종의 접촉점 데이터에서 공 표면을 감는
   측지선을 따라 뼈 길이만큼 행진하여 관절 목표를 만들고, 각 뼈를 조준(aim)한다.
   → 구종 데이터(접촉점)만으로 실제 손이 자동으로 그립을 쥔다. */
const HAND_GLB_URL = 'https://cdn.jsdelivr.net/npm/@webxr-input-profiles/assets@1.0/dist/profiles/generic-hand/right.glb';
const HAND_CHAINS = {
  thumb:  ['thumb-metacarpal','thumb-phalanx-proximal','thumb-phalanx-distal','thumb-tip'],
  index:  ['index-finger-phalanx-proximal','index-finger-phalanx-intermediate','index-finger-phalanx-distal','index-finger-tip'],
  middle: ['middle-finger-phalanx-proximal','middle-finger-phalanx-intermediate','middle-finger-phalanx-distal','middle-finger-tip'],
  ring:   ['ring-finger-phalanx-proximal','ring-finger-phalanx-intermediate','ring-finger-phalanx-distal','ring-finger-tip'],
  pinky:  ['pinky-finger-phalanx-proximal','pinky-finger-phalanx-intermediate','pinky-finger-phalanx-distal','pinky-finger-tip']
};
const HAND_PAD = { thumb:0.20, index:0.17, middle:0.18, ring:0.16, pinky:0.14 };  // 손가락 반두께(공 반지름 단위)

class HandRig {
  constructor(){
    this.ready = false;
    this.root = null;
    this.joints = {};
    this.bindQ = {};
    this.gripQ = {};
    this._v1 = new THREE.Vector3(); this._v2 = new THREE.Vector3();
    this._v3 = new THREE.Vector3(); this._q1 = new THREE.Quaternion();
  }
  load(onDone){
    new GLTFLoader().load(HAND_GLB_URL, (gltf)=>{
      try{ this._setup(gltf); this.ready = true; }catch(e){ console.warn('HandRig setup 실패', e); }
      onDone();
    }, undefined, (err)=>{ console.warn('HandRig 로드 실패 — 절차적 손 사용', err); onDone(); });
  }
  _setup(gltf){
    // root(외부 인터페이스, 항상 identity) > placer(배치 변환 보관) > 모델
    this.root = new THREE.Group();
    this.placer = new THREE.Group();
    this.root.add(this.placer);
    this.placer.add(gltf.scene);
    gltf.scene.traverse(o=>{
      o.matrixAutoUpdate = true;   // WebXR용 GLB는 관절 행렬 자동갱신이 꺼진 채 로드됨
      if(o.isBone) this.joints[o.name] = o;
      if(o.isSkinnedMesh){
        o.frustumCulled = false;
        o.material = new THREE.MeshStandardMaterial({color:0xe0a984, roughness:0.52});
      }
    });
    // WebXR GLB는 관절이 평면 계층(모든 관절이 형제) → FK가 되도록 해부학적 체인으로 재부모화.
    // attach()는 월드 변환을 보존하며 부모를 바꾼다.
    this.root.updateMatrixWorld(true);
    const ANATOMY = [
      ['wrist','thumb-metacarpal','thumb-phalanx-proximal','thumb-phalanx-distal','thumb-tip'],
      ['wrist','index-finger-metacarpal','index-finger-phalanx-proximal','index-finger-phalanx-intermediate','index-finger-phalanx-distal','index-finger-tip'],
      ['wrist','middle-finger-metacarpal','middle-finger-phalanx-proximal','middle-finger-phalanx-intermediate','middle-finger-phalanx-distal','middle-finger-tip'],
      ['wrist','ring-finger-metacarpal','ring-finger-phalanx-proximal','ring-finger-phalanx-intermediate','ring-finger-phalanx-distal','ring-finger-tip'],
      ['wrist','pinky-finger-metacarpal','pinky-finger-phalanx-proximal','pinky-finger-phalanx-intermediate','pinky-finger-phalanx-distal','pinky-finger-tip']
    ];
    for(const chain of ANATOMY){
      for(let i = 1; i < chain.length; i++){
        const parent = this.joints[chain[i-1]], child = this.joints[chain[i]];
        if(parent && child && child.parent !== parent) parent.attach(child);
      }
    }
    this.root.updateMatrixWorld(true);
    for(const [n,b] of Object.entries(this.joints)) this.bindQ[n] = b.quaternion.clone();
    // 손 배치: bind(손가락 -Y, 손바닥 -X, 엄지 -Z) → 월드(손가락 +Y, 손바닥 +Z(공쪽), 엄지 +X)
    // 오른손 검증: 엄지 = 손가락 × 손바닥 = (0,1,0)×(0,0,1) = (1,0,0) = +X ✓ (투수 시점 왼쪽)
    this.placer.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(
      new THREE.Vector3(0,0,-1), new THREE.Vector3(0,-1,0), new THREE.Vector3(-1,0,0)));
    // 손바닥이 공 쪽으로 살짝 기울도록
    this.placer.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), 0.25));
    this.placer.scale.setScalar(27.3);   // 1m = 27.3 공반지름 (공 반지름 3.66cm) → 실물 크기 비율
    // 중지 너클(MCP)이 공 뒤 기준점에 오도록 평행이동
    this.root.updateMatrixWorld(true);
    const mp = this.joints['middle-finger-phalanx-proximal'].getWorldPosition(this._v1);
    this.placer.position.add(new THREE.Vector3(0.0,-0.02,-1.30).sub(mp));
    this.root.updateMatrixWorld(true);
  }
  _addNails(){
    // 실제 손톱: 손가락 곡률을 감싸는 부분 원통 판(플레이트) + 끝의 밝은 자유연(free edge)
    const NAIL_M = new THREE.MeshStandardMaterial({color:0xf0d2c4, roughness:0.22, side:THREE.DoubleSide});
    const EDGE_M = new THREE.MeshStandardMaterial({color:0xf8ede2, roughness:0.25, side:THREE.DoubleSide});
    const ARC = 1.85;                                            // 손톱이 감싸는 각도(~106°)
    const idxProx = this.joints['index-finger-phalanx-proximal'].getWorldPosition(new THREE.Vector3());
    for(const [name, chain] of Object.entries(HAND_CHAINS)){
      const distal = this.joints[chain[2]], tip = this.joints[chain[3]];
      if(!distal || !tip) continue;
      const pad = HAND_PAD[name];
      const tp = tip.getWorldPosition(new THREE.Vector3());
      const dp = distal.getWorldPosition(new THREE.Vector3());
      const dir = tp.clone().sub(dp).normalize();               // 손가락 축 방향 (끝마디 → 손끝)
      // 손등(손톱) 방향: 일반 손가락은 바인드 포즈 손등(-Z),
      // 엄지는 마주 쥐는 방향(검지 뿌리 쪽)의 정반대 = 실제 엄지 손톱 면
      const rawDorsal = (name === 'thumb')
        ? tp.clone().sub(idxProx).normalize()
        : new THREE.Vector3(0, 0, -1);
      const dorsal = rawDorsal.addScaledVector(dir, -rawDorsal.dot(dir)).normalize();
      const rf = (name === 'thumb') ? 0.80 : 0.98;              // 엄지는 판 반경 축소(들뜸 방지)
      const g = new THREE.Group();
      // 몸판: 축이 손가락 방향(+Y), 아크 중심이 손등(+Z)을 향하는 열린 원통 셸
      const plate = new THREE.Mesh(
        new THREE.CylinderGeometry(pad*rf*1.00, pad*rf*1.12, pad*0.95, 20, 1, true, -ARC/2, ARC), NAIL_M);
      plate.position.y = -pad*0.34;
      g.add(plate);
      // 자유연: 손끝 쪽 얇고 밝은 띠
      const edge = new THREE.Mesh(
        new THREE.CylinderGeometry(pad*rf*0.99, pad*rf*1.01, pad*0.16, 20, 1, true, -ARC/2, ARC), EDGE_M);
      edge.position.y = pad*0.18;
      g.add(edge);
      const x = new THREE.Vector3().crossVectors(dir, dorsal).normalize();
      g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, dir, dorsal));
      g.position.copy(tp).addScaledVector(dorsal, pad*0.02);
      this.root.add(g);
      this.root.updateMatrixWorld(true);
      distal.attach(g);                                         // 월드 변환 보존한 채 뼈에 부착
    }
  }
  /* 측지선 행진: P0에서 접촉 방향 uC로, 각 뼈 길이만큼 목표점 생성 */
  _wrapTargets(P0, uC, lengths, pad){
    const targets = [];
    const u0 = P0.clone().normalize();
    const r0 = P0.length();
    const hugR = 1 + pad;
    let prev = P0.clone(), t = 0;
    const tmp = new THREE.Vector3();
    for(let li = 0; li < lengths.length; li++){
      const L = lengths[li];
      const isLast = (li === lengths.length-1);
      let guard = 0;
      while(guard++ < 400){
        t += 0.008;
        slerpVec(u0, uC, t, tmp);
        const R = isLast && t >= 1
          ? 1 + pad*0.72                                     // 손끝 패드는 공에 눌림
          : THREE.MathUtils.lerp(r0, hugR, smoothstep01(Math.min(t,1), 0, 0.5));
        tmp.multiplyScalar(R);
        if(tmp.distanceTo(prev) >= L) break;
      }
      targets.push(tmp.clone());
      prev.copy(tmp);
    }
    return targets;
  }
  /* 뼈 체인을 목표점들로 순서대로 조준 */
  _aimChain(chain, uC, pad){
    const joints = chain.map(n=>this.joints[n]);
    this.root.updateMatrixWorld(true);
    const P0 = joints[0].getWorldPosition(new THREE.Vector3());
    const lengths = [];
    for(let i = 0; i < 3; i++){
      lengths.push(joints[i].getWorldPosition(this._v1).distanceTo(joints[i+1].getWorldPosition(this._v2)));
    }
    const targets = this._wrapTargets(P0, uC, lengths, pad);
    for(let i = 0; i < 3; i++){
      const bone = joints[i], child = joints[i+1];
      this.root.updateMatrixWorld(true);
      const bw = bone.getWorldPosition(this._v1);
      const vCur = child.getWorldPosition(this._v2).sub(bw).normalize();
      const vDes = this._v3.copy(targets[i]).sub(bw).normalize();
      const pqInv = bone.parent.getWorldQuaternion(this._q1).invert();
      const a = vCur.applyQuaternion(pqInv).normalize();
      const b = vDes.applyQuaternion(pqInv).normalize();
      const dq = new THREE.Quaternion().setFromUnitVectors(a, b);
      if(this.debugLog) this.debugLog.push(
        chain[i]+' dqDeg='+(2*Math.acos(Math.min(1,Math.abs(dq.w)))*57.3).toFixed(1)+
        ' tgt=('+targets[i].toArray().map(n=>n.toFixed(2))+')');
      bone.quaternion.premultiply(dq);
    }
  }
  /* 구종 접촉점 데이터로 그립 포즈 + "깊이 누른" 프레스 포즈 생성 */
  pose(pitch){
    try{
      const aimAll = (padScale)=>{
        for(const [n,q] of Object.entries(this.bindQ)) this.joints[n].quaternion.copy(q);
        this.root.updateMatrixWorld(true);
        for(const [name, def] of Object.entries(pitch.grip.fingers)){
          if(!HAND_CHAINS[name]) continue;
          const uC = new THREE.Vector3(...def.pos).normalize();
          this._aimChain(HAND_CHAINS[name], uC, HAND_PAD[name]*padScale);
        }
      };
      aimAll(1.0);                       // 기본 그립
      this.gripQ = {};
      for(const [n,b] of Object.entries(this.joints)) this.gripQ[n] = b.quaternion.clone();
      aimAll(0.55);                      // 릴리스 직전 "파고들며 누르는" 포즈
      this.pressQ = {};
      for(const [n,b] of Object.entries(this.joints)) this.pressQ[n] = b.quaternion.clone();
      for(const [n,b] of Object.entries(this.joints)) b.quaternion.copy(this.gripQ[n]);
      this.lastError = null;
    }catch(e){
      this.lastError = String(e && e.stack || e);
      console.warn('HandRig.pose 실패', e);
    }
  }
  /* 릴리스 진행도 t(0~1)에서 구종별 손가락 역할대로 뼈를 움직인다.
     p<0: 그립→프레스(더 누름), p>0: 그립→펴짐 */
  setRelease(t, pitch){
    const acts = (pitch && pitch.release && pitch.release.fingers) || null;
    for(const [name, chain] of Object.entries(HAND_CHAINS)){
      const act = acts ? acts[name] : null;
      const role = act ? act.role
        : (name === 'thumb' ? 'release' : 'press');
      const timing = act ? act.timing
        : (pitch ? (name === 'thumb' ? pitch.release.thumbTiming : pitch.release.fingerTiming) : 1);
      const p = releaseFingerCurve(role, t, timing);
      for(const bn of chain){
        const g = this.gripQ[bn];
        if(!g) continue;
        const b = this.joints[bn];
        if(p >= 0) b.quaternion.slerpQuaternions(g, this.bindQ[bn], Math.min(p,1)*0.72);
        else       b.quaternion.slerpQuaternions(g, (this.pressQ && this.pressQ[bn]) || g, Math.min(-p,1));
      }
    }
  }
}
/* 손가락 역할별 릴리스 곡선. 반환 p: -1(깊이 누름) ~ 0(그립) ~ 1(펴짐) */
function releaseFingerCurve(role, t, timing){
  switch(role){
    case 'snap': {          // 긁으며 튕기기: 직전에 파고들었다가 빠르게 튕겨 펴짐
      const dig  = smoothstep01(t, timing-0.10, timing-0.02);
      const open = smoothstep01(t, timing, timing+0.05);
      return -0.95*dig*(1-open) + open;
    }
    case 'press': {         // 끝까지 눌러주기: 깊게 누른 채 버티다가 늦게 펴짐
      const dig  = smoothstep01(t, timing-0.14, timing-0.03);
      const open = smoothstep01(t, timing+0.01, timing+0.09);
      return -0.6*dig*(1-open) + open;
    }
    case 'hold': {          // 꽉 잡고 지지: 일찍 떨어지되 절반만 펴진 채 유지
      return 0.55 * smoothstep01(t, timing, timing+0.18);
    }
    case 'loose': {         // 힘 빼고 걸치기: 처음부터 살짝 열려 있고 부드럽게 펴짐
      return 0.25 + 0.55 * smoothstep01(t, timing, timing+0.25);
    }
    default: {              // release: 먼저 놓아주기
      return smoothstep01(t, timing, timing+0.12);
    }
  }
}

  constructor(){
    this.ready = false; this.root = null; this.bones = {}; this.bindQ = {};
    this._v1 = new THREE.Vector3(); this._v2 = new THREE.Vector3();
    this._v3 = new THREE.Vector3(); this._q1 = new THREE.Quaternion();
    this._t = new THREE.Vector3();
  }
  load(onDone){
    new GLTFLoader().load(XBOT_URL, (g)=>{
      try{ this._setup(g); this.ready = true; }catch(e){ console.warn('PitcherRig setup 실패', e); }
      onDone();
    }, undefined, (err)=>{ console.warn('PitcherRig 로드 실패 — 볼륨 피규어 사용', err); onDone(); });
  }
  _setup(gltf){
    this.root = new THREE.Group();
    this.root.add(gltf.scene);
    // 프로야구 선수 유니폼: 정점의 주도 뼈(skinIndex)로 부위 판정 → 버텍스 컬러
    // 피부(얼굴·손) / 흰 저지 / 네이비 언더셔츠 소매 / 흰 바지 / 검은 스파이크
    const regionColor = (boneName)=>{
      if(/Head|Neck/.test(boneName))      return [0.85, 0.60, 0.45];   // 피부
      if(/Hand/.test(boneName))           return [0.85, 0.60, 0.45];   // 손
      if(/ForeArm/.test(boneName))        return [0.07, 0.10, 0.22];   // 언더셔츠 소매
      if(/Foot|Toe/.test(boneName))       return [0.06, 0.07, 0.09];   // 스파이크
      if(/UpLeg|Leg/.test(boneName))      return [0.85, 0.87, 0.92];   // 바지
      return [0.90, 0.91, 0.95];                                       // 저지(몸통·어깨·상완)
    };
    gltf.scene.traverse(o=>{
      o.matrixAutoUpdate = true;
      if(o.isBone) this.bones[o.name] = o;
      if(o.isSkinnedMesh){
        o.frustumCulled = false;
        const g = o.geometry;
        const si = g.attributes.skinIndex, sw = g.attributes.skinWeight;
        const n = g.attributes.position.count;
        const colors = new Float32Array(n*3);
        for(let i = 0; i < n; i++){
          let best = 0, bw = -1;
          for(let k = 0; k < 4; k++){
            const w = sw.getComponent(i, k);
            if(w > bw){ bw = w; best = si.getComponent(i, k); }
          }
          colors.set(regionColor(o.skeleton.bones[best].name), i*3);
        }
        g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        o.material = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.68});
      }
    });
    for(const [n,b] of Object.entries(this.bones)) this.bindQ[n] = b.quaternion.clone();
    // 장비 부착: 모자(머리 뼈) · 글러브(왼손 뼈) · 벨트(골반 뼈) — 뼈를 따라 움직임.
    // 믹사모 뼈에는 cm→m 스케일이 배어 있어 월드 스케일을 측정해 보정한다.
    this.root.updateMatrixWorld(true);
    const attachTo = (bone, obj, wx, wy, wz)=>{
      if(!bone) return;
      const s = bone.getWorldScale(new THREE.Vector3()).x || 1;
      obj.scale.multiplyScalar(1/s);
      obj.position.set(wx/s, wy/s, wz/s);
      bone.add(obj);
    };
    const NAVY = new THREE.MeshStandardMaterial({color:0x14264d, roughness:0.6});
    const GLOVE_M = new THREE.MeshStandardMaterial({color:0x7a4a22, roughness:0.7});
    {
      const cap = new THREE.Group();
      const dome = new THREE.Mesh(new THREE.SphereGeometry(0.115, 18, 14, 0, Math.PI*2, 0, Math.PI/2), NAVY);
      dome.scale.set(1, 0.85, 1.05);
      const brim = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.013, 0.115), NAVY);
      brim.position.set(0, 0.005, 0.13);
      cap.add(dome, brim);
      attachTo(this.bones['mixamorigHead'], cap, 0, 0.145, 0.02);
    }
    {
      // 글러브: 왼손(손가락 끝까지)이 완전히 안에 들어가는 미트 (포켓 + 손목 커프)
      const glove = new THREE.Group();
      const pocket = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), GLOVE_M);
      pocket.scale.set(0.105, 0.15, 0.12);
      glove.add(pocket);
      const cuff = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 12), GLOVE_M);
      cuff.scale.set(0.08, 0.07, 0.09);
      cuff.position.set(0, -0.10, 0);
      glove.add(cuff);
      attachTo(this.bones['mixamorigLeftHand'], glove, 0, 0.085, 0.005);
    }
    {
      const belt = new THREE.Mesh(new THREE.TorusGeometry(0.135, 0.022, 10, 24), NAVY);
      belt.rotation.x = Math.PI/2;
      belt.scale.set(1, 0.75, 1);
      attachTo(this.bones['mixamorigHips'], belt, 0, -0.015, 0);
    }
    this.root.visible = false;
    fieldWorld.add(this.root);
  }
  _aim(bone, child, t3){
    if(!bone || !child) return;
    this.root.updateMatrixWorld(true);
    const bw = bone.getWorldPosition(this._v1);
    const vCur = child.getWorldPosition(this._v2).sub(bw).normalize();
    const vDes = this._v3.set(t3[0], t3[1], t3[2]).sub(bw).normalize();
    const pqInv = bone.parent.getWorldQuaternion(this._q1).invert();
    const a = vCur.applyQuaternion(pqInv).normalize();
    const b = vDes.applyQuaternion(pqInv).normalize();
    bone.quaternion.premultiply(new THREE.Quaternion().setFromUnitVectors(a, b));
  }
  retarget(pose){
    const B = this.bones;
    for(const [n,q] of Object.entries(this.bindQ)) B[n].quaternion.copy(q);
    // 힙 위치
    this.root.updateMatrixWorld(true);
    const hips = B['mixamorigHips'];
    const cur = hips.getWorldPosition(this._v1);
    this.root.position.x += pose.hip[0] - cur.x;
    this.root.position.y += pose.hip[1] - cur.y;
    this.root.position.z += pose.hip[2] - cur.z;
    // 골반: 척추를 목 방향으로 세우고, 무릎 좌우 방향으로 비틀기
    this._aim(hips, B['mixamorigSpine'], pose.neck);
    this.root.updateMatrixWorld(true);
    const hw = hips.getWorldPosition(this._v1);
    const spineDir = this._t.set(...pose.neck).sub(hw).normalize();
    const rHead = B['mixamorigRightUpLeg'].getWorldPosition(this._v2).sub(hw);
    rHead.addScaledVector(spineDir, -rHead.dot(spineDir)).normalize();
    const rDes = this._v3.set(
      pose.rKnee[0]-pose.lKnee[0], pose.rKnee[1]-pose.lKnee[1], pose.rKnee[2]-pose.lKnee[2]);
    rDes.addScaledVector(spineDir, -rDes.dot(spineDir)).normalize();
    const twistAng = Math.atan2(
      new THREE.Vector3().crossVectors(rHead, rDes).dot(spineDir), rHead.dot(rDes));
    const pqInv = hips.parent.getWorldQuaternion(this._q1).invert();
    const axisLocal = spineDir.clone().applyQuaternion(pqInv).normalize();
    hips.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(axisLocal, twistAng * 0.8));
    // 상체·팔·다리 체인 조준
    const A = (bn, cn, t)=>this._aim(B[bn], B[cn], t);
    A('mixamorigSpine2','mixamorigNeck', pose.neck);
    A('mixamorigNeck','mixamorigHead', pose.head);
    A('mixamorigRightShoulder','mixamorigRightArm', pose.rSho);
    A('mixamorigRightArm','mixamorigRightForeArm', pose.rElb);
    A('mixamorigRightForeArm','mixamorigRightHand', pose.rWri);
    A('mixamorigRightHand','mixamorigRightHandMiddle1',
      [pose.rWri[0]+(pose.rWri[0]-pose.rElb[0])*0.4,
       pose.rWri[1]+(pose.rWri[1]-pose.rElb[1])*0.4,
       pose.rWri[2]+(pose.rWri[2]-pose.rElb[2])*0.4]);
    A('mixamorigLeftShoulder','mixamorigLeftArm', pose.lSho);
    A('mixamorigLeftArm','mixamorigLeftForeArm', pose.lElb);
    A('mixamorigLeftForeArm','mixamorigLeftHand', pose.lWri);
    A('mixamorigRightUpLeg','mixamorigRightLeg', pose.rKnee);
    A('mixamorigRightLeg','mixamorigRightFoot', pose.rAnk);
    A('mixamorigRightFoot','mixamorigRightToeBase',
      [pose.rAnk[0], pose.rAnk[1]-0.04, pose.rAnk[2]+0.16]);
    A('mixamorigLeftUpLeg','mixamorigLeftLeg', pose.lKnee);
    A('mixamorigLeftLeg','mixamorigLeftFoot', pose.lAnk);
    A('mixamorigLeftFoot','mixamorigLeftToeBase',
      [pose.lAnk[0], pose.lAnk[1]-0.04, pose.lAnk[2]+0.16]);
  }
}
const pitcherRig = new PitcherRig();
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _up = new THREE.Vector3(0,1,0);

function samplePose(t, pitch){
  // t(0..1)에 해당하는 보간 포즈 반환
  let i = 0;
  while(i < POSE_TIMES.length-2 && t > POSE_TIMES[i+1]) i++;
  const t0 = POSE_TIMES[i], t1 = POSE_TIMES[i+1];
  let f = (t - t0) / (t1 - t0);
  f = f<0?0:(f>1?1:f);
  f = f*f*(3-2*f);  // smoothstep
  const out = {};
  for(const j of JOINTS){
    const a = POSES[i][j], b = POSES[i+1][j];
    out[j] = [ a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f ];
  }
  // 구종별 릴리스 높이 반영 (릴리스 구간에서 오른 손목 높이 조정)
  const rh = (pitch.motion && pitch.motion.releaseHeight) || 1.0;
  if(rh !== 1.0 && t > 0.55 && t < 0.9) out.rWri[1] *= rh;
  return out;
}
function applyPose(pose){
  for(const j of JOINTS) jointMeshes[j].position.set(...pose[j]);
  for(let i=0;i<BONE_DEFS.length;i++){
    const [a,b,r] = BONE_DEFS[i];
    _v1.set(...pose[a]); _v2.set(...pose[b]);
    const m = boneMeshes[i];
    m.position.copy(_v1).add(_v2).multiplyScalar(0.5);
    const d = _v2.clone().sub(_v1);
    m.scale.set(r, d.length(), r);
    m.quaternion.setFromUnitVectors(_up, d.normalize());
  }
  // 몸통·모자·글러브·스파이크 배치
  _v1.set(...pose.neck); _v2.set(...pose.hip);
  body.chest.position.lerpVectors(_v1, _v2, 0.30);
  body.pelvis.position.copy(_v2);
  const hd = pose.head;
  body.cap.position.set(hd[0], hd[1]+0.045, hd[2]);
  body.brim.position.set(hd[0], hd[1]+0.055, hd[2]+0.145);
  body.glove.position.set(...pose.lWri);
  body.shoeR.position.set(pose.rAnk[0], pose.rAnk[1]-0.025, pose.rAnk[2]+0.06);
  body.shoeL.position.set(pose.lAnk[0], pose.lAnk[1]-0.025, pose.lAnk[2]+0.06);
}

function renderReleaseHud(p){
  if(!(state.subMode === 'RELEASE' && p.release.fingers)) return;
  const rows = Object.entries(p.release.fingers).map(([n,a]) =>
    `<div class="hud-row${state.focusFinger===n ? ' sel' : ''}" data-finger="${n}">` +
    `<span style="color:${MARKER_COLORS[n]}">●</span> ${FINGER_KO[n]} — ${ROLE_KO[a.role]}</div>`).join('');
  el.spinHud.innerHTML =
    '<b style="color:#e8edf7">손가락 움직임 · 클릭하면 확대 관찰</b>' + rows +
    `<div class="hud-row${!state.focusFinger ? ' sel' : ''}" data-finger="">⊙ 전체 보기</div>`;
}
function setFocusFinger(name){
  clearFocusVisuals();
  state.focusFinger = name || null;
  const p = PITCHES[state.currentPitch];
  if(state.focusFinger && p.release.fingers && p.release.fingers[state.focusFinger]){
    focusLabel = makeLabel(
      FINGER_KO[state.focusFinger] + ' · ' + ROLE_KO[p.release.fingers[state.focusFinger].role],
      MARKER_COLORS[state.focusFinger]);
    trailGroup.add(focusLabel);
    // 슬로모션으로 처음부터 재생 + 손끝 근접 카메라
    state.speed = 0.25;
    document.querySelectorAll('.spd-btn').forEach(x=>x.classList.toggle('active', x.dataset.speed==='0.25'));
    resetAnimation(); state.playing = true; updatePlayBtn();
    if(handRig.ready){
      handRig.root.updateMatrixWorld(true);
      const tip = handRig.joints[HAND_CHAINS[state.focusFinger][3]].getWorldPosition(new THREE.Vector3());
      controls.target.copy(tip);
      camera.position.copy(tip).add(new THREE.Vector3(1.2, 0.6, -1.6));
    }
  } else {
    setCameraView('GRIP', true);
  }
  renderReleaseHud(p);
}
document.getElementById('spin-hud').addEventListener('click', (e)=>{
  const row = e.target.closest('[data-finger]');
  if(!row || state.subMode !== 'RELEASE') return;
  setFocusFinger(row.dataset.finger || null);
});

function buildSidebar(){
  el.sidebar.innerHTML = '';
  const byFam = {};
  for(const p of Object.values(PITCHES)){
    (byFam[p.family] = byFam[p.family] || []).push(p);
  }
  for(const fam of ['FASTBALL','BREAKING','OFFSPEED','SPECIAL']){
    if(!byFam[fam]) continue;
    const h = document.createElement('div');
    h.className = 'fam-title '+fam;
    h.textContent = FAMILY_NAMES[fam];
    el.sidebar.appendChild(h);
    for(const p of byFam[fam]){
      const b = document.createElement('button');
      b.className = 'pitch-btn' + (p.phase===2?' locked':'') + (p.id===state.currentPitch?' active':'');
      b.dataset.pitch = p.id;
      b.innerHTML = `<span>${p.nameKo}<span class="en">${p.nameEn}</span></span>` +
                    (p.phase===2 ? '<span class="lock">🔒</span>' : '<span>'+'★'.repeat(p.difficulty)+'</span>');
      if(p.phase===2){
        b.title = 'Phase 2 확장 구종 — pitches 데이터만 채우면 활성화됩니다';
      } else {
        b.addEventListener('click', ()=> selectPitch(p.id));
      }
      el.sidebar.appendChild(b);
    }
  }
}

let handLandmarker = null;
async function ensureLandmarker(){
  if(handLandmarker) return handLandmarker;
  const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const files = await vision.FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  handLandmarker = await vision.HandLandmarker.createFromOptions(files, {
    baseOptions:{ modelAssetPath:
      'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' },
    runningMode:'IMAGE', numHands:1
  });
  return handLandmarker;
}
const HAND_LINKS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

/* 구종별 사진 그립 점검 규칙 (2D 랜드마크 기반 휴리스틱) */
function gripPhotoChecks(pitchId, m){
  const c = [];
  const push = (ok, okMsg, fixMsg)=>c.push({ok, msg: ok?okMsg:fixMsg});
  switch(pitchId){
    case 'fourSeam': case 'twoSeam': case 'cutter': case 'sinker': case 'slider': case 'sweeper':
      push(m.spreadIM < 0.55, '검지·중지 간격이 좁게 잘 모였어요!', '검지와 중지를 1~2cm 정도로 더 붙여보세요.');
      push(m.extIndex && m.extMiddle, '검지·중지가 펴져서 공 위에 올라갈 준비가 됐어요.', '검지·중지를 좀 더 펴서 공 위(실밥)에 올려보세요.');
      break;
    case 'circleChange':
      push(m.circleTI < 0.45, '엄지·검지 서클(OK 모양)이 잘 만들어졌어요!', '엄지와 검지 끝을 더 가까이 모아 동그라미를 만들어보세요.');
      push(m.extMiddle && m.extRing, '중지·약지가 공을 지지할 준비가 됐어요.', '중지와 약지를 펴서 공 위를 지지해 주세요.');
      break;
    case 'vulcanChange':
      push(m.gapMR > 0.45, '중지·약지 사이가 벌칸 인사처럼 잘 벌어졌어요!', '중지와 약지 사이를 V자로 더 벌려보세요.');
      break;
    case 'forkball':
      push(m.spreadIM > 0.75, '검지·중지가 크게 벌어진 포크 그립이에요!', '검지·중지를 더 벌려야 해요 — 아프면 스플리터 그립으로!');
      break;
    case 'splitter':
      push(m.spreadIM > 0.50 && m.spreadIM < 0.95, '포크볼보다 좁고 포심보다 넓은, 딱 스플리터 폭이에요.', '포크볼보다는 좁게, 포심보다는 넓게 벌려보세요.');
      break;
    case 'curveball':
      push(m.extMiddle, '중지가 펴져서 실밥에 걸 수 있어요.', '중지를 펴서 실밥에 단단히 걸어보세요.');
      push(m.circleTI > 0.3, '검지·엄지에 힘이 안 몰려 있어요 — 좋아요.', '커브는 중지가 주인공! 검지·엄지는 힘을 빼세요.');
      break;
    case 'knuckleCurve':
      push(m.curlIndex < 0.75, '검지가 갈고리처럼 잘 구부러졌어요 — 너클 그립!', '검지를 더 구부려 손톱을 공에 대보세요.');
      push(m.extMiddle, '중지가 실밥에 걸릴 준비가 됐어요.', '중지는 펴서 실밥에 걸어주세요.');
      break;
    case 'knuckleball':
      push(m.curlIndex < 0.8 && m.curlMiddle < 0.8, '손끝을 세운 너클볼 그립이에요!', '검지·중지를 구부려 손끝(손톱)으로 공을 찍어보세요.');
      break;
    default:
      push(true, '손이 잘 인식됐어요. 왼쪽 3D 그립과 비교해 보세요.', '');
  }
  return c;
}

async function analyzeGripPhoto(file, canvas, resultDiv){
  const p = PITCHES[state.currentPitch];
  resultDiv.innerHTML = '<p style="color:var(--accent2)">🔍 손 인식 AI 준비 중... (첫 사용 시 10~20초 걸릴 수 있어요)</p>';
  try{ await ensureLandmarker(); }
  catch(e){
    console.warn(e);
    resultDiv.innerHTML = '<p style="color:var(--warn)">AI 모델을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>';
    return;
  }
  const url = URL.createObjectURL(file);
  const img = new Image();
  try{ img.src = url; await img.decode(); }
  catch(e){ resultDiv.innerHTML = '<p style="color:var(--warn)">이미지를 열 수 없어요.</p>'; return; }
  resultDiv.innerHTML = '<p style="color:var(--accent2)">🖐 손가락 위치 분석 중...</p>';
  let det;
  try{ det = handLandmarker.detect(img); }
  catch(e){ resultDiv.innerHTML = '<p style="color:var(--warn)">분석에 실패했어요. 다른 사진으로 다시 시도해 주세요.</p>'; return; }
  // 사진 + 랜드마크 그리기
  const W = Math.min(img.naturalWidth, 640);
  const H = Math.round(img.naturalHeight * W / img.naturalWidth);
  canvas.width = W; canvas.height = H;
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, W, H);
  URL.revokeObjectURL(url);
  if(!det.landmarks || det.landmarks.length === 0){
    resultDiv.innerHTML = '<p style="color:var(--warn)">손을 찾지 못했어요 😢<br>· 밝은 곳에서 · 공을 쥔 손 전체가 나오게 · 손등이 보이는 각도로 다시 찍어보세요.</p>';
    return;
  }
  const L = det.landmarks[0];
  ctx.lineWidth = Math.max(2, W/220); ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  for(const [a,b] of HAND_LINKS){
    ctx.beginPath(); ctx.moveTo(L[a].x*W, L[a].y*H); ctx.lineTo(L[b].x*W, L[b].y*H); ctx.stroke();
  }
  for(let i = 0; i < 21; i++){
    ctx.fillStyle = LM_COLOR(i);
    ctx.beginPath(); ctx.arc(L[i].x*W, L[i].y*H, Math.max(3, W/130), 0, Math.PI*2); ctx.fill();
  }
  // 손 크기 대비 거리 지표
  const d = (a,b)=>Math.hypot(L[a].x-L[b].x, L[a].y-L[b].y);
  const scale = Math.max(d(0,9), 1e-6);
  const m = {
    spreadIM: d(8,12)/scale,             // 검지-중지 끝 간격
    circleTI: d(4,8)/scale,              // 엄지-검지 끝 (서클)
    gapMR:    d(12,16)/scale,            // 중지-약지 끝 간격
    curlIndex:  d(8,5)/scale,            // 검지 굽힘 (작을수록 구부림)
    curlMiddle: d(12,9)/scale
  };
  m.extIndex  = m.curlIndex  > 0.85;
  m.extMiddle = m.curlMiddle > 0.85;
  m.extRing   = d(16,13)/scale > 0.8;
  const checks = gripPhotoChecks(p.id, m);
  const okCount = checks.filter(x=>x.ok).length;
  const lines = checks.map(x=>`<div class="score-line ${x.ok?'ok':'fix'}">${x.msg}</div>`).join('');
  const head = okCount === checks.length
    ? '💯 사진 속 그립이 아주 좋아요!'
    : '📋 아래 항목을 확인하며 다시 쥐어보세요.';
  resultDiv.innerHTML = `<div class="box"><p style="font-size:13px;margin-bottom:8px"><b>${p.nameKo}</b> 그립 사진 분석 (${okCount}/${checks.length})</p>
    <p style="font-size:13px;margin-bottom:8px">${head}</p>${lines}</div>
    <div class="disclaimer">※ 사진 각도·조명에 따라 부정확할 수 있어요. 왼쪽 3D 그립과 함께 참고용으로만 사용하세요.</div>`;
}

  state.cameraView = view;

  if(isBallMode){
    // 공 클로즈업 (뷰 버튼은 각도만 변경)
    const presets = {
      GRIP:   {pos:[3.1,2.5,-4.2], tgt:[0,0,-0.4]},   // 엄지쪽 3/4 시점 — 오른손 그립 사진 각도
      PITCHER:{pos:[0,1.6,-5.6],  tgt:[0,0,0]},

      BATTER: {pos:[5.0,1.1,3.4], tgt:[0,0,0]}
    };
    const pr = presets[view] || presets.GRIP;
    camera.position.set(...pr.pos); controls.target.set(...pr.tgt);
  } else {
    const presets = {
      GRIP:   {pos:[2.6,2.0,-2.6], tgt:[0,1.3,0.6]},     // 릴리스 포인트 클로즈업
      PITCHER:{pos:[0.8,2.3,-4.5], tgt:[0,1.2,9]},

    };
    const pr = presets[view] || presets.PITCHER;
    camera.position.set(...pr.pos); controls.target.set(...pr.tgt);
  }
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
}

function setSubMode(sub){
  state.subMode = sub;
  const isBallMode = ['GRIP','RELEASE','SPIN'].includes(sub);
  ballWorld.visible = isBallMode;
  fieldWorld.visible = !isBallMode;
  const p = PITCHES[state.currentPitch];

  if(handGroup) handGroup.visible = (sub!=='SPIN');
  if(markerGroup) markerGroup.visible = (sub==='GRIP');
  spinHelper.visible = (sub==='SPIN');
  el.spinHud.style.display = (sub==='SPIN' || sub==='RELEASE') ? 'block' : 'none';
  if(sub==='SPIN'){
    el.spinHud.innerHTML = `${p.spin.label} · 약 ${p.spin.rpm} RPM`;
  } else if(sub==='RELEASE' && p.release.fingers){
    renderReleaseHud(p);
  }
  trailGroup.visible = (sub==='RELEASE');
  if(sub!=='RELEASE') clearFocusVisuals();

  skeleton.visible = (sub==='MOTION') && !pitcherRig.ready;
  if(pitcherRig.root) pitcherRig.root.visible = (sub==='MOTION') && pitcherRig.ready;
  motionBall.visible = (sub==='MOTION');
  if(trajLine) trajLine.visible = (sub==='PATH');
  trajBall.visible = (sub==='PATH');

  resetAnimation();
  state.playing = (sub!=='GRIP');   // 그립은 정지 관찰, 나머지는 자동 재생
  updatePlayBtn();

  // 서브모드별 기본 카메라
  if(isBallMode) setCameraView('GRIP', true);
  else setCameraView('PITCHER', true);

  // 뷰 버튼 활성/비활성 (공 모드에서도 각도 변경은 허용)
  document.querySelectorAll('.sub-btn').forEach(b=>b.classList.toggle('active', b.dataset.sub===sub));

  el.btnPlay.disabled = !playable; el.btnReplay.disabled = !playable;
  document.querySelectorAll('.spd-btn').forEach(b=>b.disabled = !playable);

  if(state.topMode==='LEARN') renderLearnPanel();
}

/* ═══════════════ 애니메이션 업데이트 ═══════════════ */
const clock = new THREE.Clock();
const _spinAxis = new THREE.Vector3();
const _ballC = new THREE.Vector3(), _tipP = new THREE.Vector3(), _arDir = new THREE.Vector3();
const _lblOff = new THREE.Vector3(), _followD = new THREE.Vector3();

function updateRelease(p, dt){
  const {thumbTiming, fingerTiming} = p.release;
  if(state.playing && !releaseState.done){
    state.t += dt / DUR.RELEASE * state.speed;
    if(state.t >= 1){ state.t = 1; releaseState.done = true; }
  }
  const t = state.t;
  // 단계 라벨
  let label;
  if(t < 0.2) label = 'GRIP 그립';
  else if(t < 0.42) label = 'LOAD 준비';
  else if(t < thumbTiming) label = 'ACCELERATION 가속';
  else if(t < fingerTiming) label = 'THUMB RELEASE 엄지 분리';
  else if(t < 0.96) label = 'FINGER RELEASE 손끝 릴리스';
  else label = 'BALL SPIN 공 회전!';
  updatePhaseLabel(label + `  (${Math.round(t*100)}%)`);

  // 전체 전진 (가속 구간)
  const fwd = Math.min(t, fingerTiming) / fingerTiming;
  ballWorld.position.z = -0.8 + 1.2 * fwd*fwd;

  // 구종별 손가락 역할(누르기·긁기·지지·먼저 놓기)대로 손이 움직이며 공 분리
  const tk = smoothstep01(t, thumbTiming, thumbTiming+0.14);
  const fk = smoothstep01(t, fingerTiming, fingerTiming+0.10);
  if(handRig.ready){
    handRig.setRelease(t, p);
    // 손끝 궤적 · 동작 화살표 · 포커스 카메라 추적
    handRig.root.updateMatrixWorld(true);
    ball.getWorldPosition(_ballC);
    for(const [name, chain] of Object.entries(HAND_CHAINS)){
      const tip = handRig.joints[chain[3]].getWorldPosition(_tipP);
      const tr = fingerTrails[name];
      if(state.playing && !releaseState.done){
        tr.pts.push(tip.clone());
        if(tr.pts.length > 44) tr.pts.shift();
        tr.line.geometry.setFromPoints(tr.pts);
      }
      const isFocus = (state.focusFinger === name);
      tr.line.material.opacity = state.focusFinger ? (isFocus ? 1.0 : 0.10) : 0.85;
      // 동작 순간 화살표: 누르기=공 안쪽, 긁기=실제 손끝 이동 방향, 놓기=바깥쪽
      const act = p.release.fingers ? p.release.fingers[name] : null;
      const ar = fingerArrows[name];
      if(act && t > act.timing - 0.10 && t < act.timing + 0.12){
        ar.visible = !state.focusFinger || isFocus;
        ar.position.copy(tip);
        if(act.role === 'press'){
          _arDir.copy(_ballC).sub(tip).normalize();
        } else if(act.role === 'snap' && tr.pts.length > 3){
          _arDir.copy(tip).sub(tr.pts[tr.pts.length - 4]).normalize();
        } else {
          _arDir.copy(tip).sub(_ballC).normalize();
        }
        ar.setDirection(_arDir);
        ar.setLength(act.role === 'hold' ? 0.3 : 0.55, 0.16, 0.09);
      } else ar.visible = false;
      if(isFocus){
        focusTip.visible = true;
        focusTip.position.copy(tip);
        if(focusLabel) focusLabel.position.copy(tip).add(_lblOff.set(0, 0.42, 0));
        _followD.copy(tip).sub(controls.target);
        controls.target.copy(tip);
        camera.position.add(_followD);
      }
    }
  } else {
    const th = fingerMeshes.thumb;
    if(th){
      th.group.position.copy(th.baseDir.clone().multiplyScalar(0.55*tk)).add(new THREE.Vector3(0,-0.25*tk,0));
    }
    for(const [name,f] of Object.entries(fingerMeshes)){
      if(name==='thumb') continue;
      f.group.position.copy(f.baseDir.clone().multiplyScalar(0.45*fk));
    }
  }
  if(t > fingerTiming){
    const ft = (t - fingerTiming)/(1 - fingerTiming);
    ball.position.z = ft*ft*5.5;
    _spinAxis.set(...p.spin.axis).normalize();
    ball.rotateOnWorldAxis(_spinAxis, p.spin.speed * 18 * dt * state.speed);
  } else {
    // 릴리스 전 미세한 회전 준비
    ball.position.z = 0;
  }
}
function smoothstep01(x, a, b){
  if(x<=a) return 0; if(x>=b) return 1;
  const f=(x-a)/(b-a); return f*f*(3-2*f);
}

function updateSpin(p, dt){
  if(state.playing){
    _spinAxis.set(...p.spin.axis).normalize();
    ball.rotateOnWorldAxis(_spinAxis, p.spin.speed * 6 * dt * state.speed);
  }
  updatePhaseLabel(p.spin.label);
}

function updateMotion(p, dt){
  if(state.playing){
    state.t += dt / DUR.MOTION * state.speed;
    if(state.t >= 1){ state.t = 0; }   // 반복 재생
  }
  const t = state.t;
  const pose = samplePose(t, p);
  if(pitcherRig.ready) pitcherRig.retarget(pose);
  else applyPose(pose);
  // 단계 라벨
  let pi = 0;
  while(pi < POSE_TIMES.length-2 && t > POSE_TIMES[pi+1]) pi++;
  updatePhaseLabel('P'+pi+' · '+POSE_NAMES[pi]);
  // 공: 릴리스 전엔 오른 손목, 이후엔 홈플레이트 방향으로 비행
  const RELEASE_T = 0.78;
  if(t < RELEASE_T){
    if(pitcherRig.ready && pitcherRig.bones['mixamorigRightHandMiddle1']){
      pitcherRig.root.updateMatrixWorld(true);
      pitcherRig.bones['mixamorigRightHandMiddle1'].getWorldPosition(motionBall.position);
    } else {
      motionBall.position.set(pose.rWri[0], pose.rWri[1]+0.09, pose.rWri[2]+0.12);
    }
  } else {
    const ft = (t-RELEASE_T)/(1-RELEASE_T);
    const sx = pose.rWri[0];
    motionBall.position.set(
      sx + (0.1-sx)*ft,
      1.85 + (0.9-1.85)*ft*ft,
      1.0 + 11*ft
    );
    _spinAxis.set(...p.spin.axis).normalize();
    motionBall.rotateOnWorldAxis(_spinAxis, p.spin.speed*15*dt*state.speed);
  }
}

function updatePath(p, dt){
  const dur = DUR.PATH / p.trajectory.speedFactor;
  if(state.playing){
    state.t += dt / dur * state.speed;
    if(state.t >= 1){ state.t = 0; }   // 반복 재생
  }
  const pos = trajCurve.getPointAt(Math.min(state.t, 0.999));
  trajBall.position.copy(pos);
  _spinAxis.set(...p.spin.axis).normalize();
  trajBall.rotateOnWorldAxis(_spinAxis, p.spin.speed*20*dt*state.speed);
  updatePhaseLabel(`구속감 ${(p.trajectory.speedFactor*100).toFixed(0)}% · 비행 ${(state.t*100).toFixed(0)}%`);
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const p = PITCHES[state.currentPitch];
  switch(state.subMode){
    case 'RELEASE': updateRelease(p, dt); break;
    case 'SPIN':    updateSpin(p, dt); break;
    case 'MOTION':  updateMotion(p, dt); break;
    case 'PATH':    updatePath(p, dt); break;
    default: updatePhaseLabel('공을 드래그해서 360° 돌려보세요');
  }
  controls.update();
  renderer.render(scene, camera);
}

/* ═══════════════ 시작 ═══════════════ */
buildSidebar();
selectPitch('fourSeam');
setTopMode('LEARN');
// 리얼 인체 투수 비동기 로드 → 준비되면 MOTION 화면 갱신
pitcherRig.load(()=>{
  if(pitcherRig.ready && state.subMode === 'MOTION'){ setSubMode('MOTION'); applyDeepLink(); }
  // 진단: #debug=2 → P0 리타겟 후 주요 뼈 월드좌표 덤프
  if(pitcherRig.ready && new URLSearchParams(location.hash.replace(/^#/,'')).get('debug')==='2'){
    const pose = samplePose(0, PITCHES[state.currentPitch]);
    pitcherRig.retarget(pose);
    pitcherRig.root.updateMatrixWorld(true);
    const v = new THREE.Vector3(), lines = [];
    for(const n of ['mixamorigHips','mixamorigSpine','mixamorigSpine2','mixamorigNeck','mixamorigHead',
      'mixamorigRightArm','mixamorigRightForeArm','mixamorigRightHand',
      'mixamorigLeftArm','mixamorigLeftHand',
      'mixamorigRightUpLeg','mixamorigRightLeg','mixamorigRightFoot',
      'mixamorigLeftUpLeg','mixamorigLeftLeg','mixamorigLeftFoot']){
      pitcherRig.bones[n].getWorldPosition(v);
      lines.push(n+' ('+v.toArray().map(x=>x.toFixed(3)).join(',')+')');
    }
    lines.push('rootPos='+pitcherRig.root.position.toArray().map(x=>x.toFixed(3)));
    lines.push('rootScale='+pitcherRig.root.scale.x.toFixed(3));
    const pre = document.createElement('pre'); pre.id='pdump';
    pre.textContent = lines.join('\n');
    document.body.appendChild(pre);
  }
});
// 리깅된 리얼 핸드 비동기 로드 → 준비되면 현재 구종에 다시 적용
handRig.load(()=>{
  if(handRig.ready){ selectPitch(state.currentPitch); applyDeepLink(); }
  // 개발 진단용: #debug=1 이면 관절 월드좌표를 DOM으로 덤프
  if(new URLSearchParams(location.hash.replace(/^#/,'')).get('debug')==='1'){
    const pre = document.createElement('pre');
    pre.id = 'rigdump';
    const v = new THREE.Vector3();
    const lines = ['ready='+handRig.ready, 'lastError='+(handRig.lastError||'none')];
    if(handRig.ready){
      scene.updateMatrixWorld(true);
      lines.push('placerPos='+handRig.placer.position.toArray().map(n=>n.toFixed(3)));
      for(const [n,b] of Object.entries(handRig.joints)){
        b.getWorldPosition(v);
        lines.push(n+' ('+v.toArray().map(x=>x.toFixed(3)).join(',')+')');
      }
      // 계측 리포즈: pose를 다시 실행하며 뼈별 회전량 기록
      handRig.debugLog = [];
      handRig.pose(PITCHES[state.currentPitch]);
      lines.push('--- repose log ---', ...handRig.debugLog);
      scene.updateMatrixWorld(true);
      for(const tn of ['middle-finger-phalanx-intermediate','middle-finger-tip','thumb-tip']){
        handRig.joints[tn].getWorldPosition(v);
        lines.push('AFTER '+tn+' ('+v.toArray().map(x=>x.toFixed(3)).join(',')+')');
      }
    }
    pre.textContent = lines.join('\n');
    document.body.appendChild(pre);
  }
});
// 테스트/공유용 딥링크: index.html#pitch=slider&sub=PATH&mode=PRACTICE&t=0.9
function applyDeepLink(){
  const h = new URLSearchParams(location.hash.replace(/^#/,''));
  const hp = h.get('pitch'), hs = h.get('sub'), hm = h.get('mode');
  if(hp && PITCHES[hp] && PITCHES[hp].phase===1) selectPitch(hp);
  if(hm==='PRACTICE') setTopMode('PRACTICE');
  if(hs && ['GRIP','RELEASE','SPIN','MOTION','PATH'].includes(hs) && state.topMode==='LEARN') setSubMode(hs);
  const ht = parseFloat(h.get('t'));
  if(!isNaN(ht)){ state.t = THREE.MathUtils.clamp(ht, 0, 1); state.playing = false; }
  const hc = h.get('cam');   // 진단용: cam=x,y,z,tx,ty,tz
  if(hc){
    const c = hc.split(',').map(Number);
    if(c.length === 6 && c.every(n=>!isNaN(n))){
      camera.position.set(c[0], c[1], c[2]);
      controls.target.set(c[3], c[4], c[5]);
    }
  }
}
applyDeepLink();
resize();
animate();
window.__APP_BOOTED = true;   // 부팅 감시 해제
